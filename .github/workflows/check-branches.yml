name: check-branches
# 分支台账 ledger/branches.csv：格式、登记规则、只追加、门禁计数。只用 Python 标准库。
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: cd tests && python3 -m unittest test_branches
      - name: fetch trusted push times
        # 可信合并时间：用 GITHUB_TOKEN 只读查询 main 上 push 事件的运行（id、head_sha、created_at）。
        # 取不到时不写文件，下一步的脚本从严处理（E-BR-PUSH-TIME-UNAVAILABLE）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          # 有限次数重试（含限速）；三次都失败就不写文件，下一步计数输出 INVALID
          for i in 1 2 3; do
            if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/check-branches.yml/runs?event=push&branch=main&per_page=100" \
                 --jq '.workflow_runs[] | {id, head_sha, created_at}' > "$RUNNER_TEMP/runs.jsonl" 2> "$RUNNER_TEMP/runs.err"; then
              jq -s . "$RUNNER_TEMP/runs.jsonl" > "$RUNNER_TEMP/push-runs.json" && exit 0
            fi
            echo "::warning::取 push 运行记录失败（第 $i 次）：$(head -c 300 "$RUNNER_TEMP/runs.err")"
            sleep $((i * 20))
          done
          echo "::error::三次都取不到 push 运行记录（可能是 API 限速）；本次门禁计数和命中率输出 INVALID"
          exit 1
      - name: check ledger
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            # PR：基线取 base 与 head 的 merge-base（main 前进后仍为 head 的祖先）
            BASE=$(git merge-base "$PR_BASE" "$PR_HEAD"); REF=$PR_HEAD
          else
            # push：基线取 before；新分支（全零）时退回 origin/main 与 HEAD 的 merge-base
            REF=HEAD
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
              BASE=$PUSH_BEFORE
            else
              BASE=$(git merge-base origin/main HEAD)
            fi
          fi
          NOW=$(TZ=Asia/Singapore date +%Y-%m-%dT%H:%M:%S+08:00)
          TIME_ARGS=""
          if [ "$EVENT" = pull_request ]; then
            TIME_ARGS="--now $NOW"
          fi
          RUNS_ARG=""
          if [ -s "$RUNNER_TEMP/push-runs.json" ]; then RUNS_ARG="--push-runs $RUNNER_TEMP/push-runs.json"; fi
          # 找每组首次进入 main 的提交用的 main：PR 取 base，main push 取 HEAD，其他分支取 origin/main
          if [ "$EVENT" = pull_request ]; then MAIN_REF=$PR_BASE
          elif [ "$GITHUB_REF" = refs/heads/main ]; then MAIN_REF=HEAD
          else MAIN_REF=origin/main; fi
          python3 scripts/check-branches.py --repo . --ref "$REF" --base "$BASE" --main-ref "$MAIN_REF" $RUNS_ARG $TIME_ARGS --count-gate --stats
          # 公开检查覆盖本次 PR / push 的全部新增提交（含台账自由文本的本机路径检查）
          python3 scripts/check-public.py --range "$BASE..$REF"
